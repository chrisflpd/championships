<!doctype html>
<html lang="el">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Ομαδικά Πρωταθλήματα</title>
		<link rel="stylesheet" href="theme.css?v=2026-08-31-2">
		<link rel="stylesheet" href="config.css?v=2026-08-31-2">
		<link rel="stylesheet" href="displayer.css?v=2026-08-31-2">
		<link rel="stylesheet" href="sheets.css?v=2026-08-31-2">
		<script>
			// the theme is put on before the page is drawn, so that a dark one does
			// not go through a white flash on its way in
			try {
				const stored = localStorage.getItem('theme');
				if (stored === 'dark' || stored === 'light')
					document.documentElement.setAttribute('data-theme', stored);
			} catch (error) {
				// a browser that keeps no storage simply follows the system
			}
		</script>
	</head>
	<body>
		<header class="topbar">
			<h1>Ομαδικά Πρωταθλήματα</h1>
			<button type="button" id="theme" class="switch" role="switch" aria-checked="false" aria-label="Σκοτεινό θέμα" title="Σκοτεινό θέμα">
				<span class="switch-track" aria-hidden="true">
					<svg class="switch-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
						<circle cx="12" cy="12" r="4.5"></circle>
						<path d="M12 1.5v2.5M12 20v2.5M4 4l1.8 1.8M18.2 18.2L20 20M1.5 12h2.5M20 12h2.5M4 20l1.8-1.8M18.2 5.8L20 4"></path>
					</svg>
					<svg class="switch-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
					</svg>
					<span class="switch-knob"></span>
				</span>
			</button>
		</header>
		<main class="app">
			<section class="panel panel-config">
				<div class="panel-head">
					<h2><label for="config-input">Διαμόρφωση</label></h2>
					<button type="button" id="collapse" class="toggle" aria-expanded="true" aria-controls="config-body" aria-label="Σύμπτυξη διαμόρφωσης" title="Σύμπτυξη διαμόρφωσης">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M6 15l6-6 6 6"></path>
						</svg>
					</button>
				</div>
				<form>
					<div class="panel-body" id="config-body">
						<!-- the id is not "config": a named element becomes a property of the
						     window, and common.js already keeps a "config" of its own there -->
						<textarea id="config-input" name="config" required="required" rows="26" spellcheck="false" wrap="off" placeholder="[sports]&#10;Ποδόσφαιρο: Γήπεδο 1, Γήπεδο 2&#10;&#10;[zones]&#10;…"></textarea>
						<p class="hint">Ενότητες: <code>[sports]</code> <code>[zones]</code> <code>[days]</code> <code>[teams]</code> <code>[groups]</code> <code>[knockouts]</code>. Οι γραμμές που ξεκινούν με <code>#</code> αγνοούνται.</p>
					</div>
					<div class="toolbar">
						<button type="submit" class="button button-primary">Υποβολή</button>
						<span class="toolbar-gap"></span>
						<button type="button" id="load" class="button">Φόρτωση</button>
						<button type="button" id="save" class="button">Αποθήκευση</button>
						<button type="button" id="excel" class="button" disabled="disabled">Δημιουργία Excel</button>
					</div>
					<div id="search" hidden="hidden" role="status" aria-live="polite">
						<span class="spinner" aria-hidden="true"></span>
						<span id="search-status"></span>
						<button type="button" id="stop" class="button button-quiet">Διακοπή</button>
					</div>
					<!-- what is worth knowing about the configuration but does not stop it -->
					<div id="notice" hidden="hidden" role="status" aria-live="polite"></div>
				</form>
			</section>
			<section id="program" class="program"></section>
		</main>
		<script src="common.js?v=2026-08-31-2"></script>
		<script src="parser.js?v=2026-08-31-2"></script>
		<script src="championships.js?v=2026-08-31-2"></script>
		<script src="scheduling_algorithms.js?v=2026-08-31-2"></script>
		<script src="jszip.min.js?v=2026-08-31-2"></script>
		<script src="workbook.js?v=2026-08-31-2"></script>
		<script src="sheets.js?v=2026-08-31-2"></script>
		<script src="pages.js?v=2026-08-31-2"></script>
		<script src="points.js?v=2026-08-31-2"></script>
		<script src="displayer.js?v=2026-08-31-2"></script>
		<script src="ui.js?v=2026-08-31-2"></script>
	</body>
</html>
